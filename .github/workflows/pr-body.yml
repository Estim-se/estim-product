# Required check "issue-link": the PR description links an issue of this repository.
# A separate workflow so that editing the description rechecks it without rerunning the build, and so that the
# required "ci" check is never skipped conditionally (GitHub counts a skipped required check as passed).
name: pr-body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The check runs the base branch's copy of the script, so a PR cannot change the check that judges it.
      - name: Check out the base branch's script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: scripts/ci

      # Used only while the base branch has no scripts/ci/pr-body.ts yet (the PR that adds it).
      - name: Check out the PR's script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Check the issue link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          script=base/scripts/ci/pr-body.ts
          if [ ! -f "$script" ]; then
            echo "::notice::The base branch has no scripts/ci/pr-body.ts yet, so this run uses the PR's copy."
            script=head/scripts/ci/pr-body.ts
          fi
          bun "$script"
