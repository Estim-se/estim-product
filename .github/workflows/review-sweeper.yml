# The review gate's sweeper (plan §5): a backstop, never the only path. GitHub runs schedules on a best-effort basis
# and the test repository saw none fire for hours (step 2, F8), so nothing depends on it running on time: a push or
# "Update branch" starts a review anyway, and every review runs the drift check.
#
# It checks drift and the App installation, re-queues lost reviews (twice at most), resumes paused ones whose reason
# cleared, queues PRs that never got a check, refreshes paused checks before they go stale, opens a terse issue on
# drift or Lovable branch trouble, and recounts the ledger once a day. Only a scheduled run re-queues: a dispatched
# one can't get a model token (W3a), so it does the API work only.
name: review-sweeper

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: post
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      issues: write
    concurrency:
      group: estim-review-ledger
      queue: max
    outputs:
      prs: ${{ steps.sweep.outputs.prs }}
    steps:
      - name: Check out main's review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main

      - name: Sweep
        id: sweep
        env:
          APP_KEY: ${{ secrets.REVIEW_APP_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -I main/.github/review/review.py sweep

  requeue:
    needs: sweep
    if: github.event_name == 'schedule' && needs.sweep.outputs.prs != '' && needs.sweep.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.sweep.outputs.prs) }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/review.yml
    with:
      pr: ${{ matrix.pr }}
